{{define "content"}}
<h1>Audit log</h1>
<p>Last 50 actions.</p>
{{if .Entries}}
<table>
<thead><tr><th>When</th><th>User</th><th>Action</th><th>Target</th><th>Detail</th><th>IP</th></tr></thead>
<tbody>
{{range .Entries}}
<tr>
<td>{{.At.Format "2006-01-02 15:04"}}</td>
<td>{{with .UserID}}{{.}}{{else}}system{{end}}</td>
<td>{{.Action}}</td>
<td><code>{{.Target}}</code></td>
<td><code>{{.Detail}}</code></td>
<td><code>{{.IP}}</code></td>
</tr>
{{end}}
</tbody>
</table>
{{else}}
<p>Nothing recorded yet.</p>
{{end}}
{{end}}
